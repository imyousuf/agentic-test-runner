<!doctype html>
<title>has-text semantics</title>
<body>
  <button id="shout" type="button">SIGN IN</button>
  <button id="buy" type="button">Buy (2)</button>
  <button id="quote" type="button">Don't "ask"</button>

  <input id="placeheld" type="text" placeholder="Search orders">
  <input id="valued" type="text" placeholder="Ignored placeholder" value="typed value">
  <textarea id="area">Long form note</textarea>
  <select id="pick">
    <option>First choice</option>
    <option selected>Second choice</option>
  </select>

  <p id="nested">Outer <b id="bold">inner bold</b> tail</p>
  <p id="hidden" style="display:none">Hidden words</p>
  <p id="greek">ΣΟΣΙΑΣ ΟΔΟΣ</p>

  <svg width="120" height="20"><text id="svg-label" x="0" y="15">Chart title</text></svg>

  <ul>
    <li class="item" id="alpha-one">Alpha one</li>
    <li class="item" id="alpha-two">Alpha two</li>
    <li class="item" id="beta">Beta</li>
  </ul>
</body>

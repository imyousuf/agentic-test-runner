name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # robotgo and the X11 helpers used by `internal/computer` need native
      # libraries on Linux. macOS/Windows ship the equivalents with the OS.
      - name: Install Linux runtime dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxtst-dev libxss-dev libpng-dev \
            libxkbcommon-dev libx11-dev xclip xsel

      # web/dist is build output and is not committed, so it has to exist
      # before any Go step: //go:embed all:dist is a compile-time error without
      # it, and `go test` compiles too.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Download dependencies
        run: go mod download

      # Kept as `go build ./...` rather than `make build`: this compiles every
      # package, including any that the atr binary does not import.
      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxtst-dev libxss-dev libpng-dev \
            libxkbcommon-dev libx11-dev xclip xsel

      # web/dist is build output and is not committed, so it has to exist
      # before any Go step: //go:embed all:dist is a compile-time error without
      # it, and `go test` compiles too.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Run go vet
        run: go vet ./...

      # The noweb tag lets contributors build without Node. Nothing exercised
      # it before, so it was free to break.
      - name: Build without the web assets
        run: go build -tags noweb ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'gofmt -w .'"
            gofmt -l .
            exit 1
          fi

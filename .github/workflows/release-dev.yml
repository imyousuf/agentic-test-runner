name: Release Dev

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz
          - target: linux-arm64
            os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: ''
            archive: tar.gz
          - target: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
            archive: tar.gz
          - target: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Linux runtime dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxtst-dev libxss-dev libpng-dev \
            libxkbcommon-dev libx11-dev xclip xsel

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        shell: bash
        run: |
          # On linux-arm64 the rod browser auto-download has no Chromium
          # build for the architecture, so skip the browser-touching
          # packages there. PR CI on linux-amd64 already enforces these.
          #
          # internal/agent and internal/testscript launch a browser too: the
          # compiled-behaviour tests drive real pages, and the secret-fill
          # tests type into a real form. They belong on this list for exactly
          # the same reason as the other two.
          if [ "${{ matrix.target }}" = "linux-arm64" ]; then
            go test $(go list ./... | grep -Ev '/(internal/browser|internal/api|internal/agent|internal/testscript)$')
          else
            go test ./...
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="dev-$SHORT_SHA"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-X main.version=$VERSION -X main.commit=${{ github.sha }} -X main.date=$DATE"
          mkdir -p dist
          go build -ldflags "$LDFLAGS" -o dist/atr${{ matrix.ext }} ./cmd/atr

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd dist
          tar -czvf atr-${{ matrix.target }}.tar.gz atr
          rm atr

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd dist
          7z a atr-${{ matrix.target }}.zip atr.exe
          rm atr.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atr-${{ matrix.target }}
          path: dist/atr-${{ matrix.target }}.*
          retention-days: 7

  release:
    name: Publish Dev Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "version=dev-$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          ls -la dist/
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Delete existing dev release
        run: |
          gh release delete dev --yes || true
          git push origin :refs/tags/dev || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development Build (${{ steps.version.outputs.short_sha }})
          body: |
            ## Development Build

            This is an automated development build from the `main` branch.

            **Commit:** ${{ github.sha }}
            **Date:** ${{ steps.version.outputs.date }}

            ### Installation

            Download the appropriate archive for your platform and extract the `atr` binary.

            **Linux:** Requires X11 and a few system libraries for `atr computer` (mouse/keyboard/screen control). Install with:

            ```bash
            sudo apt-get install -y libxtst-dev libxss-dev libpng-dev libxkbcommon-dev libx11-dev xclip xsel
            ```

            **Linux/macOS:**
            ```bash
            tar -xzf atr-<platform>.tar.gz
            chmod +x atr
            sudo mv atr /usr/local/bin/
            ```

            **Windows:**
            Extract `atr.exe` from the zip file and add it to your PATH.

            > **Note:** Intel macOS (darwin-amd64) and Windows ARM64 are not
            > pre-built. Apple has fully transitioned to Apple silicon;
            > GitHub-hosted `windows-11-arm` runners do not yet ship a CGo
            > toolchain that can compile robotgo. Both can be built from source
            > with `make build`.

            ---

            > **Note:** This is a development build and may contain unstable features.
            > For stable releases, please use tagged versions.
          files: |
            dist/atr-linux-amd64.tar.gz
            dist/atr-linux-arm64.tar.gz
            dist/atr-darwin-arm64.tar.gz
            dist/atr-windows-amd64.zip
            dist/checksums.txt
          prerelease: true
          make_latest: false

name: Release Dev

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Get version info
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "version=dev-$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build all platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          LDFLAGS="-X main.version=$VERSION -X main.commit=$COMMIT -X main.date=$DATE"

          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/atr ./cmd/atr
          tar -czvf dist/atr-linux-amd64.tar.gz -C dist atr
          rm dist/atr

          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/atr ./cmd/atr
          tar -czvf dist/atr-linux-arm64.tar.gz -C dist atr
          rm dist/atr

          # macOS AMD64
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/atr ./cmd/atr
          tar -czvf dist/atr-darwin-amd64.tar.gz -C dist atr
          rm dist/atr

          # macOS ARM64
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/atr ./cmd/atr
          tar -czvf dist/atr-darwin-arm64.tar.gz -C dist atr
          rm dist/atr

          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/atr.exe ./cmd/atr
          cd dist && zip atr-windows-amd64.zip atr.exe && rm atr.exe && cd ..

          # Windows ARM64
          GOOS=windows GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/atr.exe ./cmd/atr
          cd dist && zip atr-windows-arm64.zip atr.exe && rm atr.exe && cd ..

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Delete existing dev release
        run: |
          gh release delete dev --yes || true
          git push origin :refs/tags/dev || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development Build (${{ steps.version.outputs.short_sha }})
          body: |
            ## Development Build

            This is an automated development build from the `main` branch.

            **Commit:** ${{ github.sha }}
            **Date:** ${{ steps.version.outputs.date }}

            ### Installation

            Download the appropriate archive for your platform and extract the `atr` binary.

            **Linux/macOS:**
            ```bash
            tar -xzf atr-<platform>.tar.gz
            chmod +x atr
            sudo mv atr /usr/local/bin/
            ```

            **Windows:**
            Extract `atr.exe` from the zip file and add it to your PATH.

            ---

            > **Note:** This is a development build and may contain unstable features.
            > For stable releases, please use tagged versions.
          files: |
            dist/atr-linux-amd64.tar.gz
            dist/atr-linux-arm64.tar.gz
            dist/atr-darwin-amd64.tar.gz
            dist/atr-darwin-arm64.tar.gz
            dist/atr-windows-amd64.zip
            dist/atr-windows-arm64.zip
            dist/checksums.txt
          prerelease: true
          make_latest: false
